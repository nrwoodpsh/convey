# Prometheus 스크레이프 설정(㊱ P5) — kafka-exporter에서 Kafka/consumer 지표 수집.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
